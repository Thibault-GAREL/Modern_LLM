# A bilingual English and French model, 111M trained / 97M deployed.
#
# Architecture is configs/best.yaml, which won the ablation sweep in
# docs/ablations.md on both axes at once (lowest held-out loss AND smallest
# deployed model). Only the vocabulary and the training budget change here.
#
# Data: 70% English FineWeb-Edu, 30% French FineWeb2 fra_Latn, interleaved
# document by document by scripts/prepare_data.py.
#
# Tokenizer: CroissantLLM 32k, trained for a French and English model. An
# English-centric tokenizer spends 30 to 50% more tokens on the same French
# text, which is 30 to 50% more compute for the same content.
#
# Expect a model that writes fluent-looking text in both languages and cannot
# answer a question. CroissantLLM is 1.3B on 3T tokens, so 13x the model and
# 500x the data. This is an architecture exercise, not an assistant.
#
#   python scripts/prepare_data.py --out data/bilingual --tokens 6e9 --en-ratio 0.7
#   python -m mllm.train --config configs/bilingual_100m.yaml --data-dir data/bilingual

model:
  d_model: 768
  n_layers: 12
  # overwritten at load time by the tokenizer that produced the data, kept here
  # so the config is valid on its own
  vocab_size: 32000
  max_seq_len: 2048
  bias: false
  dropout: 0.0             # pretraining on fresh tokens never repeats a sample
  tie_embeddings: true     # 24.6M parameters saved, 22% of the model

  attention:
    kind: mqa              # best measured, and the smallest KV cache
    n_heads: 12
    n_kv_heads: 1
    qk_norm: false         # measured +0.030 on this exact combination

  position:
    kind: rope
    rope_theta: 10000.0    # 2048 context, no need for 500000
    rope_style: half

  ffn:
    kind: swiglu
    multiple_of: 256

  norm:
    kind: rmsnorm
    placement: pre

  init:
    scheme: fixed
    std: 0.02
    scaled_residual: true

  mtp_depth: 2             # best single addition, and dropped at inference
  mtp_lambda: 0.3

train:
  precision: bf16          # falls back to fp16 automatically on pre-Ampere GPUs
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_grad_norm: 1.0

  # WSD, not cosine. The plateau means the token budget is not locked in before
  # the run starts, so the pod can be stopped and the run extended later.
  schedule: wsd
  warmup_steps: 2000
  decay_steps: 6000
  # 46000 steps x 8 x 8 x 2048 = 6.03B tokens, about 62 per deployed parameter
  max_steps: 46000

  # 8 x 8 overflows 24 GB. MTP depth 2 computes three cross entropies over a
  # 32k vocabulary, and the LM head produces its logits in fp32, so the logits
  # alone are 3 x batch x seq x 32000 x 4 bytes. At batch 8 and seq 2048 that
  # is 6.3 GB before any activation. Halving the micro batch and doubling the
  # accumulation keeps the same 131k tokens per step.
  micro_batch_size: 4
  grad_accum_steps: 16     # effective batch of 64 sequences, 131k tokens per step
  seq_len: 2048

  z_loss_coef: 1.0e-4
  activation_checkpointing: false   # a 100M model at 2048 fits without it on 24 GB

  seed: 0
  log_interval: 20
  eval_interval: 500
  # ~40 minutes of compute between checkpoints. /workspace is not persistent on
  # RunPod, so this is what a stopped pod costs at worst.
  ckpt_interval: 2000
