[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modern-llm"
version = "0.1.0"
description = "Reference PyTorch library of documented deviations from the 2017 Transformer, built for ablations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Thibault GAREL" }]
dependencies = [
    "torch>=2.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
flash = [
    "flash-attn>=2.6",
]
bench = [
    "matplotlib>=3.8",
]
# the bilingual run: corpus download, tokenization, tracking
train = [
    "mlflow>=2.14",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "pyarrow>=15",
]
# scripts/app.py, the web page to try a checkpoint
demo = [
    "gradio>=5",
    "tokenizers>=0.19",
    "requests>=2.31",
]
# bench/eval_model.py and bench/eval_llm.py
eval = [
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "pyarrow>=15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
