<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" width="1000" height="360" preserveAspectRatio="xMidYMid meet">
  <title>Modern LLM, from the 2017 Transformer to the current open-weights defaults</title>
  <!--
  NODE REGISTRY (x, y, w, h)
  LEFT  70 120 350 170   (120..290)
  RIGHT 580 120 350 170
  arrow 430,205 -> 566,205
  badges row y=316 h=26, w=106, gap=10, start x=41
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    </style>
    <filter id="shadow-sm" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <marker id="arrow-big" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#3B82F6"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="56" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">Modern LLM</text>
  <text x="500" y="80" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">a PyTorch ablation library for everything that changed since Attention Is All You Need</text>
  <line x1="450" y1="100" x2="550" y2="100" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== LEFT PANEL, the 2017 reference ===== -->
  <g>
    <rect x="70" y="120" width="350" height="170" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="96" y="152" font-size="12.5" font-weight="600" fill="#475569">Vaswani et al. · 2017</text>
    <circle cx="102" cy="178" r="3.5" fill="#94A3B8"/>
    <text x="118" y="182" font-size="12" font-weight="400" fill="#64748B">LayerNorm, post-norm</text>
    <circle cx="102" cy="204" r="3.5" fill="#94A3B8"/>
    <text x="118" y="208" font-size="12" font-weight="400" fill="#64748B">Multi-Head Attention</text>
    <circle cx="102" cy="230" r="3.5" fill="#94A3B8"/>
    <text x="118" y="234" font-size="12" font-weight="400" fill="#64748B">ReLU feed-forward, 4 · d</text>
    <circle cx="102" cy="256" r="3.5" fill="#94A3B8"/>
    <text x="118" y="260" font-size="12" font-weight="400" fill="#64748B">sinusoidal positions</text>
  </g>

  <!-- ===== ARROW ===== -->
  <text x="500" y="192" font-size="10" font-weight="600" fill="#3B82F6" text-anchor="middle">one config flag each</text>
  <line x1="430" y1="205" x2="566" y2="205" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-big)"/>
  <text x="500" y="228" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">naive path + fast path</text>
  <text x="500" y="242" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">equivalence tested</text>

  <!-- ===== RIGHT PANEL, current defaults ===== -->
  <g>
    <rect x="580" y="120" width="350" height="170" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="580" y="120" width="4" height="170" rx="2" fill="#3B82F6"/>
    <text x="606" y="152" font-size="12.5" font-weight="600" fill="#1E40AF">open-weights models · 2025</text>
    <circle cx="612" cy="178" r="3.5" fill="#CBD5E1"/>
    <text x="628" y="182" font-size="12" font-weight="400" fill="#334155">RMSNorm, pre-norm, in fp32</text>
    <circle cx="612" cy="204" r="3.5" fill="#3B82F6"/>
    <text x="628" y="208" font-size="12" font-weight="400" fill="#334155">GQA, MLA, sliding window</text>
    <circle cx="612" cy="230" r="3.5" fill="#8B5CF6"/>
    <text x="628" y="234" font-size="12" font-weight="400" fill="#334155">SwiGLU, fine-grained MoE</text>
    <circle cx="612" cy="256" r="3.5" fill="#EAB308"/>
    <text x="628" y="260" font-size="12" font-weight="400" fill="#334155">RoPE, YaRN, NTK scaling</text>
  </g>

  <!-- ===== BADGE ROW ===== -->
  <g>
    <rect x="41" y="316" width="106" height="26" rx="13" fill="#FEF9C3" stroke="#EAB308" stroke-width="1"/>
    <text x="94" y="333" font-size="11" font-weight="600" fill="#854D0E" text-anchor="middle">RoPE · YaRN</text>

    <rect x="157" y="316" width="106" height="26" rx="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="210" y="333" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">GQA · MLA</text>

    <rect x="273" y="316" width="106" height="26" rx="13" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="326" y="333" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">RMSNorm</text>

    <rect x="389" y="316" width="106" height="26" rx="13" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1"/>
    <text x="442" y="333" font-size="11" font-weight="600" fill="#6D28D9" text-anchor="middle">SwiGLU</text>

    <rect x="505" y="316" width="106" height="26" rx="13" fill="#FDF2F8" stroke="#EC4899" stroke-width="1"/>
    <text x="558" y="333" font-size="11" font-weight="600" fill="#9D174D" text-anchor="middle">MoE</text>

    <rect x="621" y="316" width="106" height="26" rx="13" fill="#FEF9C3" stroke="#EAB308" stroke-width="1"/>
    <text x="674" y="333" font-size="11" font-weight="600" fill="#854D0E" text-anchor="middle">MTP</text>

    <rect x="737" y="316" width="106" height="26" rx="13" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1"/>
    <text x="790" y="333" font-size="11" font-weight="600" fill="#0E7490" text-anchor="middle">KV cache</text>

    <rect x="853" y="316" width="106" height="26" rx="13" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <text x="906" y="333" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">muP</text>
  </g>
</svg>
