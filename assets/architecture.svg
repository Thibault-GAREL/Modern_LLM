  <!-- ====== RIGHT SIDE MODULES ====== -->
  <g>
    <rect x="660" y="930" width="250" height="76" rx="10" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="676" y="956" font-size="12" font-weight="600" fill="#854D0E">Positions · rotary</text>
    <text x="676" y="974" font-size="10" font-weight="400" fill="#A16207">RoPE · YaRN · NTK · ALiBi · NoPE</text>
    <text x="676" y="990" font-size="9.5" font-weight="400" fill="#A16207">cos / sin precomputed in fp32</text>
  </g>
  <line x1="660" y1="968" x2="574" y2="968" stroke="#EAB308" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <g>
    <rect x="660" y="1030" width="250" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="676" y="1054" font-size="11" font-weight="600" fill="#475569">KV cache (inference)</text>
    <text x="676" y="1071" font-size="9.5" font-weight="400" fill="#64748B">dense · ring (SWA) · latent (MLA)</text>
  </g>
  <line x1="660" y1="1060" x2="572" y2="1060" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- config flag pills -->
  <g>
    <rect x="660" y="800" width="280" height="24" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="800" y="816" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">norm.kind · norm.placement · unit_offset</text>
  </g>
  <line x1="534" y1="812" x2="656" y2="812" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <g>
    <rect x="660" y="630" width="280" height="24" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="800" y="646" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">ffn.kind · moe.top_k · n_shared_experts</text>
  </g>
  <line x1="594" y1="642" x2="656" y2="642" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <g>
    <rect x="660" y="1190" width="280" height="24" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="800" y="1206" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">tie_embeddings · vocab_size · d_model</text>
  </g>
  <line x1="584" y1="1202" x2="656" y2="1202" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ====== EMBEDDING ====== -->
  <line x1="430" y1="1178" x2="430" y2="1118" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="280" y="1178" width="300" height="52" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="280" y="1178" width="4" height="52" rx="2" fill="#06B6D4"/>
    <text x="302" y="1200" font-size="13" font-weight="600" fill="#0E7490">Token Embedding</text>
    <text x="302" y="1218" font-size="10" font-weight="400" fill="#0E7490">lookup table · can be tied with the head</text>
  </g>

  <!-- ====== INPUT ====== -->
  <line x1="430" y1="1268" x2="430" y2="1232" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="280" y="1268" width="300" height="48" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="430" y="1289" font-size="13" font-weight="600" fill="#9A3412" text-anchor="middle">Input tokens</text>
    <text x="430" y="1306" font-size="10" font-weight="400" fill="#B45309" text-anchor="middle">token ids · shape (B, T)</text>
  </g>

  <!-- ====== LEGEND ====== -->
  <g>
    <rect x="60" y="1350" width="14" height="14" rx="3" fill="#FFEDD5" stroke="#F97316"/>
    <text x="80" y="1361" font-size="10" fill="#1E293B">Inputs</text>
    <rect x="150" y="1350" width="14" height="14" rx="3" fill="#ECFEFF" stroke="#06B6D4"/>
    <text x="170" y="1361" font-size="10" fill="#1E293B">Embedding</text>
    <rect x="270" y="1350" width="14" height="14" rx="3" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="290" y="1361" font-size="10" fill="#1E293B">Attention</text>
    <rect x="380" y="1350" width="14" height="14" rx="3" fill="#F5F3FF" stroke="#8B5CF6"/>
    <text x="400" y="1361" font-size="10" fill="#1E293B">FFN</text>
    <rect x="450" y="1350" width="14" height="14" rx="3" fill="#FDF2F8" stroke="#EC4899"/>
    <text x="470" y="1361" font-size="10" fill="#1E293B">MoE</text>
    <rect x="520" y="1350" width="14" height="14" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="540" y="1361" font-size="10" fill="#1E293B">Norm</text>
    <rect x="600" y="1350" width="14" height="14" rx="3" fill="#ECFDF5" stroke="#10B981"/>
    <text x="620" y="1361" font-size="10" fill="#1E293B">Outputs</text>
    <rect x="690" y="1350" width="14" height="14" rx="3" fill="#FEF9C3" stroke="#EAB308"/>
    <text x="710" y="1361" font-size="10" fill="#1E293B">Key choice / optional</text>
  </g>
</svg>
