<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" preserveAspectRatio="xMidYMid meet">
  <title>Modern LLM, the modern decoder block with every deviation behind a config flag</title>
  <!--
  NODE REGISTRY (x, y, w, h)
  OUTPUT     280 100  300 48    LMHEAD   280 200 300 64    MTP      680 200 230 64
  FINALNORM  330 320  200 32    GROUP    230 380 400 772   (380..1152)
  ADD2       c(430,436) r14     FFN      270 562 150 160   MOE      440 562 150 160
  NORM2      330 792  200 32    ADD1     c(430,864) r14    ATTN     290 914 280 140
  NORM1      330 1084 200 32    EMB      280 1178 300 52   INPUT    280 1268 300 48
  RoPE 660 930 250 76   KVcache 660 1030 250 60
  pills 660 630 / 660 800 / 660 1190 (280x24)   legend y 1350
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    </style>
    <filter id="shadow-sm" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EAB308"/>
    </marker>
    <marker id="mini-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="1000" height="1400" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="50" font-size="18" font-weight="700" fill="#111827">Modern LLM · the modern decoder block</text>
  <text x="40" y="71" font-size="12" font-weight="400" fill="#6B7280">every deviation from Vaswani et al. (2017) sits behind one config flag · src/mllm</text>
  <line x1="40" y1="80" x2="330" y2="80" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>

  <!-- ====== OUTPUT ====== -->
  <g>
    <rect x="280" y="100" width="300" height="48" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="430" y="121" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">Next-token logits</text>
    <text x="430" y="138" font-size="10" font-weight="400" fill="#047857" text-anchor="middle">(B, T, vocab_size) · computed in fp32</text>
  </g>
  <line x1="430" y1="200" x2="430" y2="150" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== LM HEAD ====== -->
  <g>
    <rect x="280" y="200" width="300" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="280" y="200" width="4" height="64" rx="2" fill="#10B981"/>
    <text x="302" y="226" font-size="13" font-weight="600" fill="#065F46">LM Head</text>
    <text x="302" y="245" font-size="10" font-weight="400" fill="#047857">weights tied to embedding · z-loss in fp32</text>
    <rect x="494" y="210" width="72" height="18" rx="9" fill="none" stroke="#10B981" stroke-width="1"/>
    <text x="530" y="223" font-size="9.5" font-weight="600" fill="#065F46" text-anchor="middle">heads.py</text>
  </g>

  <!-- MTP side module -->
  <g>
    <rect x="680" y="200" width="230" height="64" rx="10" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="696" y="226" font-size="12" font-weight="600" fill="#854D0E">MTP heads × mtp_depth</text>
    <text x="696" y="245" font-size="9.5" font-weight="400" fill="#A16207">aux losses · draft for spec decoding</text>
  </g>
  <circle cx="430" cy="295" r="3" fill="#EAB308"/>
  <path d="M 430,295 L 770,295 Q 790,295 790,275 L 790,266"
        fill="none" stroke="#EAB308" stroke-width="1.5" stroke-dasharray="5,3"
        stroke-linecap="round" marker-end="url(#arrow-amber)"/>

  <!-- ====== FINAL NORM ====== -->
  <line x1="430" y1="320" x2="430" y2="266" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="330" y="320" width="200" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="430" y="340" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Final RMSNorm · fp32</text>
  </g>
  <line x1="430" y1="422" x2="430" y2="354" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== DECODER BLOCK GROUP ====== -->
  <g>
    <rect x="230" y="380" width="400" height="772" rx="14" fill="#64748B0D" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="242" y="369" width="118" height="22" rx="11" fill="#1E293B"/>
    <text x="301" y="384" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Decoder Block</text>
    <rect x="540" y="369" width="80" height="22" rx="11" fill="#1E293B"/>
    <text x="580" y="384" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">× n_layers</text>
  </g>

  <!-- ADD 2 (after FFN / MoE) -->
  <circle cx="430" cy="436" r="14" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <line x1="424" y1="436" x2="436" y2="436" stroke="#64748B" stroke-width="1.5"/>
  <line x1="430" y1="430" x2="430" y2="442" stroke="#64748B" stroke-width="1.5"/>

  <!-- FFN and MoE merge into ADD2 -->
  <path d="M 345,562 L 345,500 Q 345,480 365,480 L 428,480" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 515,562 L 515,500 Q 515,480 495,480 L 432,480" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="430" cy="480" r="3" fill="#64748B"/>
  <line x1="430" y1="480" x2="430" y2="452" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== FFN ====== -->
  <g>
    <rect x="270" y="562" width="150" height="160" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="270" y="562" width="4" height="160" rx="2" fill="#8B5CF6"/>
    <text x="286" y="588" font-size="12.5" font-weight="600" fill="#6D28D9">SwiGLU</text>
    <text x="286" y="605" font-size="10" font-weight="400" fill="#7C3AED">GeGLU · ReGLU</text>
    <text x="286" y="620" font-size="10" font-weight="400" fill="#8B5CF6">MLP 4d (2017)</text>
    <rect x="286" y="629" width="100" height="18" rx="9" fill="#1E293B"/>
    <text x="336" y="642" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">d_ff = 8/3 · d</text>
    <g transform="translate(300,648)">
      <line x1="20" y1="52" x2="9" y2="21" stroke="#C4B5FD" stroke-width="1.2" marker-end="url(#mini-arrow)"/>
      <line x1="20" y1="52" x2="33" y2="21" stroke="#C4B5FD" stroke-width="1.2" marker-end="url(#mini-arrow)"/>
      <line x1="20" y1="52" x2="57" y2="21" stroke="#C4B5FD" stroke-width="1.2" marker-end="url(#mini-arrow)"/>
      <line x1="44" y1="52" x2="9" y2="21" stroke="#C4B5FD" stroke-width="1.2" marker-end="url(#mini-arrow)"/>
      <line x1="44" y1="52" x2="33" y2="21" stroke="#C4B5FD" stroke-width="1.2" marker-end="url(#mini-arrow)"/>
      <line x1="44" y1="52" x2="57" y2="21" stroke="#C4B5FD" stroke-width="1.2" marker-end="url(#mini-arrow)"/>
      <circle cx="20" cy="56" r="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="44" cy="56" r="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="8" cy="14" r="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="32" cy="14" r="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="56" cy="14" r="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
    </g>
  </g>

  <!-- "or" pill between the two FFN variants -->
  <rect x="412" y="680" width="36" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="430" y="694" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">or</text>

  <!-- ====== MoE ====== -->
  <g>
    <rect x="440" y="562" width="150" height="160" rx="10" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="440" y="562" width="4" height="160" rx="2" fill="#EC4899"/>
    <text x="456" y="588" font-size="12.5" font-weight="600" fill="#9D174D">MoE</text>
    <text x="456" y="605" font-size="10" font-weight="400" fill="#BE185D">router top-k of n</text>
    <text x="456" y="620" font-size="10" font-weight="400" fill="#BE185D">+ shared experts</text>
    <rect x="456" y="629" width="100" height="18" rx="9" fill="#1E293B"/>
    <text x="506" y="642" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">aux-loss-free</text>
    <rect x="456" y="662" width="24" height="24" rx="5" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="486" y="662" width="24" height="24" rx="5" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2" opacity="0.55"/>
    <rect x="516" y="662" width="24" height="24" rx="5" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="546" y="662" width="24" height="24" rx="5" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2" opacity="0.55"/>
    <text x="513" y="704" font-size="9" font-weight="400" fill="#BE185D" text-anchor="middle">experts (2 of 4 active)</text>
  </g>

  <!-- NORM2 splits into FFN and MoE -->
  <path d="M 390,792 L 390,772 Q 390,752 370,752 L 365,752 Q 345,752 345,732 L 345,724"
        fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 470,792 L 470,772 Q 470,752 490,752 L 495,752 Q 515,752 515,732 L 515,724"
        fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- ====== NORM 2 ====== -->
  <g>
    <rect x="330" y="792" width="200" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="430" y="812" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">RMSNorm · fp32</text>
  </g>
  <line x1="430" y1="850" x2="430" y2="826" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ADD 1 (after attention) -->
  <circle cx="430" cy="864" r="14" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <line x1="424" y1="864" x2="436" y2="864" stroke="#64748B" stroke-width="1.5"/>
  <line x1="430" y1="858" x2="430" y2="870" stroke="#64748B" stroke-width="1.5"/>
  <line x1="430" y1="914" x2="430" y2="880" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== ATTENTION ====== -->
  <g>
    <rect x="290" y="914" width="280" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <rect x="290" y="914" width="4" height="140" rx="2" fill="#3B82F6"/>
    <text x="312" y="942" font-size="13" font-weight="600" fill="#1E40AF">Attention</text>
    <text x="312" y="961" font-size="11" font-weight="400" fill="#1D4ED8">MHA · MQA · GQA · MLA</text>
    <text x="312" y="980" font-size="9.5" font-weight="400" fill="#64748B">qk_norm · softcap · SWA · sinks</text>
    <text x="322" y="1038" font-size="10" font-weight="600" fill="#3B82F6" text-anchor="middle">Q</text>
    <text x="352" y="1038" font-size="10" font-weight="600" fill="#3B82F6" text-anchor="middle">K</text>
    <text x="382" y="1038" font-size="10" font-weight="600" fill="#3B82F6" text-anchor="middle">V</text>
    <g transform="translate(496,970)">
      <g transform="translate(10,-10)" opacity="0.45">
        <rect width="30" height="30" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
        <line x1="10" y1="0" x2="10" y2="30" stroke="#3B82F6" stroke-width="0.8"/>
        <line x1="20" y1="0" x2="20" y2="30" stroke="#3B82F6" stroke-width="0.8"/>
        <line x1="0" y1="10" x2="30" y2="10" stroke="#3B82F6" stroke-width="0.8"/>
        <line x1="0" y1="20" x2="30" y2="20" stroke="#3B82F6" stroke-width="0.8"/>
      </g>
      <g transform="translate(5,-5)" opacity="0.7">
        <rect width="30" height="30" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
        <line x1="10" y1="0" x2="10" y2="30" stroke="#3B82F6" stroke-width="0.8"/>
        <line x1="20" y1="0" x2="20" y2="30" stroke="#3B82F6" stroke-width="0.8"/>
        <line x1="0" y1="10" x2="30" y2="10" stroke="#3B82F6" stroke-width="0.8"/>
        <line x1="0" y1="20" x2="30" y2="20" stroke="#3B82F6" stroke-width="0.8"/>
      </g>
      <g>
        <rect width="30" height="30" rx="3" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.4"/>
        <line x1="10" y1="0" x2="10" y2="30" stroke="#3B82F6" stroke-width="0.8"/>
        <line x1="20" y1="0" x2="20" y2="30" stroke="#3B82F6" stroke-width="0.8"/>
        <line x1="0" y1="10" x2="30" y2="10" stroke="#3B82F6" stroke-width="0.8"/>
        <line x1="0" y1="20" x2="30" y2="20" stroke="#3B82F6" stroke-width="0.8"/>
      </g>
    </g>
  </g>

  <!-- ====== NORM 1 ====== -->
  <line x1="430" y1="1084" x2="430" y2="1056" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="330" y="1084" width="200" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="430" y="1104" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">RMSNorm · fp32</text>
  </g>

  <!-- Residual 1: before NORM1 into ADD1 -->
  <circle cx="430" cy="1140" r="3" fill="#64748B"/>
  <path d="M 430,1140 L 282,1140 Q 262,1140 262,1120 L 262,884 Q 262,864 282,864 L 412,864"
        fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3"
        stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Residual 2: after ADD1 into ADD2 -->
  <circle cx="430" cy="840" r="3" fill="#64748B"/>
  <path d="M 430,840 L 282,840 Q 262,840 262,820 L 262,456 Q 262,436 282,436 L 412,436"
        fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3"
